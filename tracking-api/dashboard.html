<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nielsen TV Assistant — User Action Dashboard</title>
  <style>
    :root{--navy:#0f2a44;--blue:#2067e3;--pale:#eef4ff;--bg:#f4f6fa;--ink:#182230;--muted:#667085;--line:#d0d5dd;--good:#087a55;--card:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    header{background:linear-gradient(135deg,var(--navy),#183f66);color:white;padding:24px clamp(18px,4vw,54px)}header h1{margin:4px 0 5px;font-size:clamp(24px,4vw,36px)}header p{margin:0;color:#dbe8f8}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.toolbar input{min-width:310px;flex:1;max-width:640px;padding:11px 13px;border:1px solid #6f88a3;border-radius:10px;background:#fff;color:#17202a}.toolbar button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#fff;color:var(--navy)}
    main{padding:24px clamp(16px,4vw,54px) 60px;max-width:1500px;margin:auto}.status{min-height:24px;color:var(--muted);margin-bottom:10px}.error{color:#b42318}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}.card{background:var(--card);border:1px solid #e2e7ee;border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(15,42,68,.05)}.card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.card .value{font-size:30px;font-weight:800;margin-top:5px}.card.action .value{font-size:25px}.card.action{border-top:4px solid var(--blue)}
    .panel{background:var(--card);border:1px solid #e2e7ee;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(15,42,68,.05)}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:17px 18px;border-bottom:1px solid #e8ebf0}.panel-head h2{font-size:18px;margin:0}.panel-head input{padding:9px 11px;border:1px solid var(--line);border-radius:9px;min-width:260px}
    .table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{text-align:left;padding:13px 16px;border-bottom:1px solid #edf0f4}th{font-size:12px;color:var(--muted);background:#fbfcfe;position:sticky;top:0}tbody tr{cursor:pointer}tbody tr:hover{background:var(--pale)}.user{font-weight:750}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:var(--pale);color:#164eaa;font-size:12px;font-weight:700}.muted{color:var(--muted)}
    dialog{width:min(920px,94vw);max-height:92vh;border:0;border-radius:18px;padding:0;box-shadow:0 25px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(10,20,35,.62)}.modal-head{position:sticky;top:0;z-index:2;background:white;padding:20px 22px;border-bottom:1px solid #e5e9ef;display:flex;justify-content:space-between;gap:16px}.modal-head h2{margin:0;font-size:20px;word-break:break-all}.close{background:#eef1f5;border:0;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer}.modal-body{padding:20px 22px;overflow:auto}.user-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:22px}.mini{background:#f8fafc;border:1px solid #e7ebf0;border-radius:12px;padding:12px}.mini b{display:block;margin-top:4px;word-break:break-word}
    .timeline{position:relative;margin-left:13px}.timeline:before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:2px;background:#ccd9ec}.event{position:relative;padding:0 0 21px 38px}.dot{position:absolute;left:0;top:3px;width:20px;height:20px;border:4px solid white;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px #9bbcf2}.event-card{border:1px solid #e0e6ee;border-radius:13px;padding:14px;background:white}.event-top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.event-title{font-weight:800;font-size:15px}.elapsed{color:var(--good);font-weight:750;white-space:nowrap}.event-meta{color:var(--muted);font-size:12px;margin-top:3px}.values{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.value-chip{background:#f2f5f9;border-radius:8px;padding:5px 8px;font-size:12px;max-width:100%;word-break:break-word}.empty{text-align:center;padding:45px;color:var(--muted)}
    @media(max-width:650px){.toolbar input{min-width:100%}.panel-head{align-items:stretch;flex-direction:column}.panel-head input{min-width:100%}.event-top{flex-direction:column;gap:4px}.elapsed{white-space:normal}}
  </style>
</head>
<body>
<header>
  <div>NIELSEN STREAMING PANEL</div>
  <h1>TV Assistant Behaviour Dashboard</h1>
  <p>Launches, language choices, TV scans and install-assistant progress.</p>
  <div class="toolbar"><input id="apiBase" aria-label="Tracker API URL"><button id="reload">Refresh dashboard</button></div>
</header>
<main>
  <div id="status" class="status">Loading…</div>
  <section id="summaryCards" class="cards"></section>
  <section class="panel">
    <div class="panel-head"><h2>Users</h2><input id="search" placeholder="Search user ID, language or action"></div>
    <div class="table-wrap"><table><thead><tr><th>User ID</th><th>Last action</th><th>Events</th><th>Language</th><th>TVs found</th><th>Last seen</th></tr></thead><tbody id="users"></tbody></table></div>
  </section>
</main>
<dialog id="detailDialog">
  <div class="modal-head"><div><div class="muted">USER ACTION FLOW</div><h2 id="detailTitle"></h2></div><button class="close" aria-label="Close">×</button></div>
  <div id="detailBody" class="modal-body"></div>
</dialog>
<script>
const PROD_API='https://tr-aqz5boo4qa-el.a.run.app/tracker';
const servedByApi=location.protocol.startsWith('http')&&location.pathname.startsWith('/tracker');
const queryApi=new URLSearchParams(location.search).get('api');
const apiInput=document.querySelector('#apiBase');
apiInput.value=queryApi||localStorage.getItem('trackerApi')||(servedByApi?location.origin+'/tracker':PROD_API);
const statusEl=document.querySelector('#status'),usersEl=document.querySelector('#users'),searchEl=document.querySelector('#search');
const dialog=document.querySelector('#detailDialog');let allUsers=[];
const labels={app_launched:'App launched',language_selected:'Language selected',tv_scan_completed:'TV scan completed',installation_button_clicked:'Installation button clicked',after_install_button_clicked:'After-install button clicked'};
function api(){return apiInput.value.trim().replace(/\/$/,'')}
function fmtDate(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.valueOf())?'—':d.toLocaleString()}
function fmtDuration(ms){if(ms===null||ms===undefined)return'First action';if(ms<1000)return ms+' ms';const s=Math.round(ms/1000);if(s<60)return s+' sec';const m=Math.floor(s/60),rs=s%60;if(m<60)return m+'m '+rs+'s';const h=Math.floor(m/60),rm=m%60;return h+'h '+rm+'m'}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function get(path){const r=await fetch(api()+path,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return r.json()}
function summaryCards(summary){const cards=[['Total users',summary.total_users],['Total actions',summary.total_events],...Object.entries(summary.action_counts||{}).map(([k,v])=>[labels[k]||k,v,true])];document.querySelector('#summaryCards').innerHTML=cards.map(([l,v,a])=>`<article class="card ${a?'action':''}"><div class="label">${esc(l)}</div><div class="value">${Number(v||0).toLocaleString()}</div></article>`).join('')}
function renderUsers(){const term=searchEl.value.trim().toLowerCase();const rows=allUsers.filter(u=>!term||[u.user_id,u.last_action,u.language,u.selected_tv_name].some(v=>String(v||'').toLowerCase().includes(term)));usersEl.innerHTML=rows.length?rows.map(u=>`<tr data-user="${encodeURIComponent(u.user_id)}"><td class="user">${esc(u.user_id)}</td><td><span class="badge">${esc(labels[u.last_action]||u.last_action||'—')}</span></td><td>${Number(u.event_count||0)}</td><td>${esc(u.language||'—')}</td><td>${u.last_tv_count??'—'}</td><td>${esc(fmtDate(u.last_seen_at))}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">No users found</td></tr>`;usersEl.querySelectorAll('tr[data-user]').forEach(r=>r.onclick=()=>openUser(decodeURIComponent(r.dataset.user)))}
function valueChips(value){const entries=Object.entries(value||{});if(!entries.length)return'<span class="muted">No extra value</span>';return`<div class="values">${entries.map(([k,v])=>`<span class="value-chip"><b>${esc(k)}:</b> ${esc(typeof v==='object'?JSON.stringify(v):v)}</span>`).join('')}</div>`}
async function openUser(userId){dialog.showModal();document.querySelector('#detailTitle').textContent=userId;document.querySelector('#detailBody').innerHTML='<div class="empty">Loading action flow…</div>';try{const data=await get('/users/'+encodeURIComponent(userId));const u=data.user||{},events=data.events||[];document.querySelector('#detailBody').innerHTML=`<div class="user-summary"><div class="mini">First seen<b>${esc(fmtDate(u.first_seen_at))}</b></div><div class="mini">Last seen<b>${esc(fmtDate(u.last_seen_at))}</b></div><div class="mini">Total actions<b>${Number(u.event_count||0)}</b></div><div class="mini">Language<b>${esc(u.language||'—')}</b></div><div class="mini">TVs found<b>${u.last_tv_count??'—'}</b></div></div><div class="timeline">${events.length?events.map(e=>`<div class="event"><span class="dot"></span><div class="event-card"><div class="event-top"><div><div class="event-title">${esc(labels[e.action]||e.action)}</div><div class="event-meta">${esc(fmtDate(e.server_at||e.client_at))} · session ${esc(e.session_id||'—')}</div></div><div class="elapsed">+ ${esc(fmtDuration(e.elapsed_since_previous_ms))}</div></div>${valueChips(e.value)}</div></div>`).join(''):'<div class="empty">No actions recorded</div>'}</div>`}catch(err){document.querySelector('#detailBody').innerHTML=`<div class="empty error">${esc(err.message)}</div>`}}
async function load(){localStorage.setItem('trackerApi',api());statusEl.className='status';statusEl.textContent='Loading…';try{const[summary,userData]=await Promise.all([get('/summary'),get('/users?limit=500')]);summaryCards(summary);allUsers=userData.users||[];renderUsers();statusEl.textContent=`Updated ${new Date().toLocaleTimeString()} · ${allUsers.length} users loaded`;}catch(err){statusEl.className='status error';statusEl.textContent='Could not load dashboard: '+err.message}}
document.querySelector('#reload').onclick=load;searchEl.oninput=renderUsers;dialog.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});load();
</script>
</body>
</html>
