name: Build TV Companion APK

on:
  pull_request:
    paths:
      - 'tv-companion/**'
      - '.github/workflows/build-tv-companion.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: tv-companion
        run: gradle --no-daemon clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-companion-debug-apk
          path: tv-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
